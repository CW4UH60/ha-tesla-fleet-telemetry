name: Add-on

on:
  push:
    branches:
      - main
      - codex/home-assistant-receiver
    paths:
      - tesla_telemetry_receiver/**
      - .github/workflows/addon.yml
  pull_request:
    paths:
      - tesla_telemetry_receiver/**
      - .github/workflows/addon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    name: Build amd64 receiver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build receiver image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tesla_telemetry_receiver
          push: false
          platforms: linux/amd64
          build-args: BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21
          cache-from: type=gha
          cache-to: type=gha,mode=max
